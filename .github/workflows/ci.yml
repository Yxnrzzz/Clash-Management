name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Non-blocking: reports findings without failing the build. There are
      # two known high-severity advisories in this app's dependency tree
      # today (sharp via next's image optimizer, xlsx/SheetJS) that a hard
      # gate would trip on permanently — xlsx has no upstream fix at all,
      # and it's core to the PRD's export feature. See HANDOFF.md §12.
      - run: npm audit --audit-level=high
        continue-on-error: true

  api:
    name: API (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - run: npm ci
      # Generate before lint/test/build: TypeScript can't resolve
      # @prisma/client's generated types otherwise.
      - run: npx prisma generate
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  security:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Runs the open-source gitleaks CLI directly (MIT licensed) rather
      # than the gitleaks/gitleaks-action wrapper, whose PR-comment feature
      # requires a paid license for org-owned repos — `detect` itself does
      # not. Scans full git history, not just the working tree.
      - name: Scan for committed secrets
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo -v --redact

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    # Only build images once the underlying app actually lints/tests/builds
    # — a broken app has no business producing a "successful" image.
    needs: [web, api]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          build-args: |
            API_ORIGIN=http://api:3001

      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          push: false
